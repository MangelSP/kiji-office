[package]
name = "kiji-office"
version = "0.1.0"
description = "Oficina de agentes de IA en pixel art"
authors = ["Miguel Ángel Sánchez Peralta"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiji_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Llavero del sistema. En keyring 4 la feature por defecto `v1` elige el almacén de cada plataforma
# (apple-native / windows-native / secret-service); no existen las features `*-native` del plan.
keyring = "4"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# App móvil (M1 de PLAN-movil.md): cifrado de punta a punta compatible con NaCl/libsodium (`crypto_box`), WebSocket
# hacia el relay, HTTP a la puerta y a Google, y el QR de vinculación en SVG.
crypto_box = { version = "0.9", features = ["std", "getrandom"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
rand = "0.9"
reqwest = { version = "0.13", features = ["json", "form"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
