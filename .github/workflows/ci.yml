name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias de Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:core

      # Los bundles de Tauri exigen que existan el sidecar y el recurso (los genera build:core).
      - name: Sidecar de Node (necesario para compilar src-tauri)
        run: npm run fetch:node -- x86_64-unknown-linux-gnu

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
